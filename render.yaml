services:
  - type: web
    name: nagardrishti-pwa
    runtime: docker
    rootDir: nagardrishti-frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: AI_CATEGORY_PROVIDER
        value: local-ml
      - key: DATABASE_URL
        fromDatabase:
          name: nagardrishti-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        value: "NagarDrishti <onboarding@resend.dev>"
      - key: OTP_FALLBACK_EMAIL
        sync: false
      - key: OFFICER_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OBJECT_STORAGE_REQUIRED
        value: "false"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false

databases:
  - name: nagardrishti-db
    databaseName: nagardrishti
    user: nagardrishti
    plan: free
