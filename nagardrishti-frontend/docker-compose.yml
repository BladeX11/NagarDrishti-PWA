services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nd_postgres
    environment:
      POSTGRES_DB: nagardrishti
      POSTGRES_USER: nd_dev
      POSTGRES_PASSWORD: nd_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nd_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    profiles: ["media"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nd_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
