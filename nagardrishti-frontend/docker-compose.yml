services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nd_postgres
    environment:
      POSTGRES_DB: nagardrishti
      POSTGRES_USER: nd_dev
      POSTGRES_PASSWORD: nd_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
